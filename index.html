<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blucherville Press</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --dim: #888888;
      --faint: #666666;
      --border: #222222;
    }

    html, body {
      background: var(--black);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 52px 40px 44px;
      border-bottom: 0.5px solid var(--border);
    }

    header img { width: 200px; display: block; }

    .divisions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 32px 64px;
      border-right: 0.5px solid var(--border);
      text-decoration: none;
      color: var(--white);
      transition: background 0.3s ease;
      cursor: pointer;
    }

    .card:last-child { border-right: none; }
    .card:hover { background: #161616; }

    .card-logo-wrap {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }

    .card-image {
      max-width: 240px;
      max-height: 240px;
      width: auto;
      height: auto;
      object-fit: contain;
      mix-blend-mode: lighten;
    }

    .card-image.wide {
      max-width: 320px;
      max-height: 160px;
    }

    .card-rule {
      width: 40px;
      height: 0.5px;
      background: #444;
      margin-bottom: 24px;
    }

    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 12px;
      text-align: center;
    }

    .card-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 300;
      color: var(--dim);
      font-style: italic;
      margin-bottom: 32px;
      text-align: center;
    }

    .card-link {
      font-size: 11px;
      color: var(--faint);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
    }

    footer {
      border-top: 0.5px solid #333;
      padding: 22px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    footer p {
      font-size: 11px;
      color: #666;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
    }

    @media (max-width: 720px) {
      .divisions { grid-template-columns: 1fr; }
      .card { border-right: none; border-bottom: 0.5px solid var(--border); }
      .card:last-child { border-bottom: none; }
      header img { width: 160px; }
    }
  </style>
</head>
<body>

  <header>
    <img src="images/bvpress-logo.png" alt="Blucherville Press" />
  </header>

  <main class="divisions">

    <a class="card" href="https://sethbrandonart.com" target="_blank" rel="noopener">
      <div class="card-logo-wrap">
        <img class="card-image" src="images/seth-card.png" alt="Seth Brandon Art" />
      </div>
      <div class="card-rule"></div>
      <div class="card-title">Seth Brandon</div>
      <div class="card-tag">Art &amp; Illustration</div>
      <div class="card-link">sethbrandonart.com ↗</div>
    </a>

    <a class="card" href="https://thelosttraveler.co" target="_blank" rel="noopener">
      <div class="card-logo-wrap">
        <img class="card-image" src="images/tlt-card.png" alt="The Lost Traveler" />
      </div>
      <div class="card-rule"></div>
      <div class="card-title">The Lost Traveler</div>
      <div class="card-tag">Adventure is out there</div>
      <div class="card-link">thelosttraveler.co ↗</div>
    </a>

    <a class="card" href="majestic/index.html">
      <div class="card-logo-wrap">
        <img class="card-image wide" src="images/majestic-card.png" alt="Majestic" />
      </div>
      <div class="card-rule"></div>
      <div class="card-title">Majestic</div>
      <div class="card-tag">Sci-fi graphic novel series</div>
      <div class="card-link">bluchervillepress.com/majestic →</div>
    </a>

  </main>

  <footer>
    <p>Storytelling Through Art</p>
  </footer>

</body>
</html>
