<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Majestic — Blucherville Press</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      padding: 28px 40px;
      border-bottom: 0.5px solid #222;
    }
    nav a {
      font-size: 10px;
      color: #555;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
    }
    nav a:hover { color: #fff; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
      text-align: center;
    }
    .majestic-logo {
      width: 320px;
      margin-bottom: 48px;
    }
    .rule { width: 40px; height: 0.5px; background: #333; margin: 0 auto 32px; }
    p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 300;
      color: #666;
      font-style: italic;
    }
    footer {
      border-top: 0.5px solid #181818;
      padding: 18px 40px;
      text-align: center;
    }
    footer p {
      font-size: 9px;
      color: #2a2a2a;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
      font-style: normal;
    }
  </style>
</head>
<body>
  <nav><a href="../index.html">← Blucherville Press</a></nav>
  <main>
    <img class="majestic-logo" src="../images/majestic-card.png" alt="Majestic" />
    <div class="rule"></div>
    <p>Coming 2026.</p>
  </main>
  <footer><p>Storytelling Through Art</p></footer>
</body>
</html>
